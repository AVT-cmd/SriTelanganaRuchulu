<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <g fill="none" stroke="#D18826" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.04">
    <!-- Center massive loop motif (Kolam style) -->
    <path d="M 80 20 C 120 20 120 60 140 80 C 120 100 120 140 80 140 C 40 140 40 100 20 80 C 40 60 40 20 80 20 Z" />
    <path d="M 20 80 C 20 40 60 40 80 20 C 100 40 140 40 140 80 C 140 120 100 120 80 140 C 60 120 20 120 20 80 Z" />
    
    <!-- Inner floral loop -->
    <path d="M 80 40 Q 100 40 100 60 T 120 80 T 100 100 T 80 120 T 60 100 T 40 80 T 60 60 T 80 40 Z" />
    
    <!-- Corner sweeping curves for perfect seamless tiling -->
    <path d="M 0 60 C 20 40 40 20 60 0" />
    <path d="M 160 60 C 140 40 120 20 100 0" />
    <path d="M 0 100 C 20 120 40 140 60 160" />
    <path d="M 160 100 C 140 120 120 140 100 160" />
    
    <path d="M 0 20 C 20 10 30 0 40 0" />
    <path d="M 160 20 C 140 10 130 0 120 0" />
    <path d="M 0 140 C 20 150 30 160 40 160" />
    <path d="M 160 140 C 140 150 130 160 120 160" />

    <!-- Chukkalu (Dots) -->
    <g fill="#D18826" stroke="none" opacity="0.06">
      <!-- Center dot -->
      <circle cx="80" cy="80" r="4" />
      
      <!-- Inner ring -->
      <circle cx="80" cy="50" r="3" />
      <circle cx="80" cy="110" r="3" />
      <circle cx="50" cy="80" r="3" />
      <circle cx="110" cy="80" r="3" />
      
      <!-- Middle ring -->
      <circle cx="50" cy="50" r="3" />
      <circle cx="110" cy="50" r="3" />
      <circle cx="50" cy="110" r="3" />
      <circle cx="110" cy="110" r="3" />
      
      <!-- Outer diamond points -->
      <circle cx="80" cy="20" r="3.5" />
      <circle cx="80" cy="140" r="3.5" />
      <circle cx="20" cy="80" r="3.5" />
      <circle cx="140" cy="80" r="3.5" />
      
      <!-- Corner edges for seamless pattern -->
      <circle cx="0" cy="0" r="3" />
      <circle cx="160" cy="0" r="3" />
      <circle cx="0" cy="160" r="3" />
      <circle cx="160" cy="160" r="3" />
      
      <circle cx="20" cy="20" r="2.5" />
      <circle cx="140" cy="20" r="2.5" />
      <circle cx="20" cy="140" r="2.5" />
      <circle cx="140" cy="140" r="2.5" />
    </g>
  </g>
</svg>
